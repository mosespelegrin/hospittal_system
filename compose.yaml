# Local/production-like stack:  docker compose up --build
# Set APP_KEY (php artisan key:generate --show) and DB_PASSWORD in a .env next to this file.
services:
  app:
    build: .
    restart: unless-stopped
    ports: ["8080:80"]
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?set APP_KEY}
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_DATABASE: hospital_system
      DB_USERNAME: hospital
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      LOG_CHANNEL: stderr
    depends_on:
      db: { condition: service_healthy }
    volumes:
      - app_storage:/var/www/html/storage/app
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: hospital_system
      MYSQL_USER: hospital
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      retries: 10
volumes:
  app_storage:
  db_data:
